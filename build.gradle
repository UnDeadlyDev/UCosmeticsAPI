plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.github.UndeadlyDev.UCosmetics'
version = findProperty('apiVersion') ?: '1.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.11-R0.1-SNAPSHOT'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'UCosmeticsAPI'
            pom {
                name = 'UCosmeticsAPI'
                description = 'Public API UCosmetics'
            }
        }
    }
}